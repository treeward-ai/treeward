# Treeward Kubernetes manifests (stub-agent control-plane demo).
#
# Required Secrets (in namespace "treeward", created before applying):
#
#   1. Secret/treeward-enroll (key: token)
#      Connector enrollment secret used by:
#        - treeward-api: validates connector enrollment (POST /v1/connectors/enroll)
#          via TREEWARD_ENROLL_TOKEN.
#        - treeward-connector: enrolls with treeward-api on startup to obtain its
#          managed connector bearer token via TREEWARD_ENROLL_TOKEN.
#
#   2. Secret/treeward-admin-bootstrap (key: token)
#      Admin operator token minting secret (MUST be distinct from treeward-enroll):
#        - treeward-api ONLY: validates POST /v1/tokens via
#          TREEWARD_ADMIN_BOOTSTRAP_TOKEN.
#        - NEVER mounted into treeward-connector or treeward-agent.
#
#   3. Agent-to-connector auth (per-node Kubernetes projected SA tokens):
#      In Kubernetes, treeward-agent mounts a short-lived projected
#      ServiceAccount token (audience: treeward-connector, expiry: 600s) and
#      re-reads it on each request via TREEWARD_AGENT_TOKEN_FILE.
#      treeward-connector runs with TREEWARD_LOCAL_AUTH=k8s, validates each
#      token via TokenReview (matching audience), looks up the bound pod's
#      spec.nodeName, and rejects /v1/local/report or /v1/local/attest payloads
#      whose node identity does not match (403 Forbidden).
#      (For non-Kubernetes VM installs, shared-token mode via
#      TREEWARD_LOCAL_TOKEN remains supported.)
#
#   4. TLS between agent and connector (follow-up for full in-cluster PKI):
#      treeward-connector supports TLS 1.3 natively when TREEWARD_TLS_CERT and
#      TREEWARD_TLS_KEY are mounted from a Kubernetes TLS Secret (e.g. managed
#      by cert-manager) and agents point TREEWARD_CONNECTOR_URL at
#      https://treeward-connector:8090. Full automated in-cluster TLS / custom
#      CA trust provisioning for agents is tracked as a follow-up.
#
# `make quickstart` creates the required Secrets automatically with distinct
# random values stored in `.treeward/quickstart.env` (mode 0600, gitignored).
# To create them manually:
#
#   kubectl create namespace treeward --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n treeward create secret generic treeward-enroll \
#     --from-literal=token="$(openssl rand -hex 32)"
#   kubectl -n treeward create secret generic treeward-admin-bootstrap \
#     --from-literal=token="$(openssl rand -hex 32)"
---
apiVersion: v1
kind: Namespace
metadata:
  name: treeward
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: treeward-connector
  namespace: treeward
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: treeward-agent
  namespace: treeward
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: treeward-connector-auth
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: treeward-connector-auth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: treeward-connector-auth
subjects:
  - kind: ServiceAccount
    name: treeward-connector
    namespace: treeward
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: treeward-api-data
  namespace: treeward
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: treeward-api
  namespace: treeward
spec:
  selector:
    app: treeward-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: treeward-api
  namespace: treeward
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: treeward-api
  template:
    metadata:
      labels:
        app: treeward-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-data-perms
          image: treeward:quickstart
          imagePullPolicy: Never
          command:
            - /bin/sh
            - -c
            - mkdir -p /mnt/data /mnt/keys && chown -R 10001:10001 /mnt/data /mnt/keys && chmod 0700 /mnt/data /mnt/keys
          # Pod-level runAsNonRoot: true would block chown on the PVC mount;
          # override runAsNonRoot/runAsUser on this initContainer only so it can
          # set 10001:10001 ownership before the non-root api container starts.
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
                - DAC_OVERRIDE
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /mnt
      containers:
        - name: api
          image: treeward:quickstart
          imagePullPolicy: Never
          command: ["/app/api"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          env:
            - name: TREEWARD_ADDR
              value: ":8080"
            - name: TREEWARD_ENROLL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: treeward-enroll
                  key: token
            - name: TREEWARD_ADMIN_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: treeward-admin-bootstrap
                  key: token
            - name: TREEWARD_KEY_DIR
              value: /var/treeward/keys
            - name: TREEWARD_DATA_DIR
              value: /var/treeward/data
            # Dev/quickstart demo only: allows stub attestation quotes without SHIRUDO_BIN.
            # Remove in production and configure SHIRUDO_BIN (treeward-api fails closed by default).
            - name: TREEWARD_ALLOW_STUB_ATTEST
              value: "true"
            # Two-person separation of duties is enforced by default (binding creator cannot
            # approve their own binding). `make quickstart` mints distinct operator and approver
            # tokens; set TREEWARD_ALLOW_SELF_APPROVE=true only for single-operator dev setups.
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /var/treeward/data
              subPath: data
            - name: data
              mountPath: /var/treeward/keys
              subPath: keys
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: treeward-api-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: treeward-connector
  namespace: treeward
spec:
  selector:
    app: treeward-connector
  ports:
    - name: http
      port: 8090
      targetPort: 8090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: treeward-connector
  namespace: treeward
spec:
  replicas: 1
  selector:
    matchLabels:
      app: treeward-connector
  template:
    metadata:
      labels:
        app: treeward-connector
    spec:
      serviceAccountName: treeward-connector
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: connector
          image: treeward:quickstart
          imagePullPolicy: Never
          command: ["/app/connector"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          env:
            - name: TREEWARD_API_URL
              value: http://treeward-api:8080
            - name: TREEWARD_ENROLL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: treeward-enroll
                  key: token
            - name: TREEWARD_LOCAL_AUTH
              value: "k8s"
            - name: TREEWARD_K8S_AUDIENCE
              value: "treeward-connector"
            # Dev/quickstart demo only: stub runtime reports 3 virtual nodes (<node>-canary, -n1, -n2).
            # Remove for production Shirudo deployments so only exact spec.nodeName matches are accepted.
            - name: TREEWARD_K8S_ALLOW_STUB_NODES
              value: "true"
            - name: TREEWARD_CLUSTER
              value: kind-treeward-quickstart
            # Bind all interfaces inside the pod so kube-proxy/Service traffic reaches the connector.
            - name: TREEWARD_CONNECTOR_ADDR
              value: ":8090"
          ports:
            - containerPort: 8090
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 1
            periodSeconds: 3
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: treeward-agent
  namespace: treeward
spec:
  selector:
    matchLabels:
      app: treeward-agent
  template:
    metadata:
      labels:
        app: treeward-agent
    spec:
      serviceAccountName: treeward-agent
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: treeward:quickstart
          imagePullPolicy: Never
          command: ["/app/agent"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          env:
            - name: TREEWARD_RUNTIME
              value: "stub"
            - name: TREEWARD_CONNECTOR_URL
              value: http://treeward-connector:8090
            - name: TREEWARD_AGENT_TOKEN_FILE
              value: /var/run/secrets/treeward/token
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: connector-token
              mountPath: /var/run/secrets/treeward
              readOnly: true
      volumes:
        - name: connector-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: treeward-connector
                  expirationSeconds: 600
                  path: token
